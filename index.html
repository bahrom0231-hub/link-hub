<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahrom | Link Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }

        .profile {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeIn 1s ease-out;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            padding: 3px;
            margin-bottom: 1rem;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--text-dim);
            font-size: 1rem;
        }

        .links-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation: slideUp 0.8s ease-out forwards;
        }

        .link-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text);
            text-align: center;
            font-weight: 400;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .footer {
            margin-top: auto;
            padding: 2rem;
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glassmorphism accent */
        .glass-blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            filter: blur(80px);
            opacity: 0.15;
            z-index: -1;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="glass-blob" style="top: -100px; left: -100px;"></div>
    <div class="glass-blob" style="bottom: -100px; right: -100px;"></div>

    <div class="profile">
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Bahrom" alt="Avatar" class="profile-img">
        <h1>Bahrom</h1>
        <p>Software Developer & Tech Enthusiast</p>
    </div>

    <div class="links-container">
        <a href="https://github.com/bahrom0231-hub" class="link-card" target="_blank">
            <span>GitHub</span>
        </a>
        <a href="https://t.me/bahrom0231" class="link-card" target="_blank">
            <span>Telegram</span>
        </a>
        <a href="https://linkedin.com/in/bahrom" class="link-card" target="_blank">
            <span>LinkedIn</span>
        </a>
        <a href="https://instagram.com/bahrom" class="link-card" target="_blank">
            <span>Instagram</span>
        </a>
        <a href="mailto:bahrom0231@gmail.com" class="link-card">
            <span>Email</span>
        </a>
    </div>

    <footer class="footer">
        &copy; 2026 Bahrom Hub. Barcha huquqlar himoyalangan.
    </footer>
</body>
</html>
