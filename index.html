    <!-- Google Fonts: Plus Jakarta Sans -->

    <!-- Font Awesome -->

    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0a0a0a;
            --card-border: #1f1f1f;
            --card-border-hover: #333333;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --badge-bg: #141414;
            --badge-border: #262626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 60px 20px;
        }

        .container {
            width: 100%;
            max-width: 580px;
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 4px;
            /* Space for the gradient border */
            background: linear-gradient(135deg, #00f2fe, #4facfe, #f093fb, #f5576c);
            /* Glowing effect */
            box-shadow: 0 0 25px rgba(79, 172, 254, 0.4), 0 0 25px rgba(240, 147, 251, 0.4);
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--bg-color);
            /* Separator from glow */
            /* Assuming dark photo, background black as fallback */
            background-color: #000;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: var(--badge-bg);
            border: 1px solid var(--badge-border);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            /* Green status */
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        /* GRID LINKS */
        .grid-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 24px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 160px;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            border-color: var(--card-border-hover);
            transform: translateY(-4px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            background-color: #111111;
        }

        /* Full width card for specific items */
        .card.span-2 {
            grid-column: span 2;
            min-height: 140px;
            /* Slightly shorter for full width */
        }

        /* Card Header (Icon & Arrow) */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .icon-box {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .arrow {
            color: #555555;
            font-size: 14px;
            transition: color 0.3s ease, transform 0.3s ease;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #141414;
            border-radius: 50%;
        }

        .card:hover .arrow {
            color: var(--text-main);
            transform: translateX(4px) translateY(-4px);
            background: #222222;
        }

        /* Card Body (Text) */
        .card-body h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .card-body p {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Customizable Icon Backgrounds */
        .icon-telegram {
            background: rgba(36, 129, 204, 0.1);
            color: #2AABEE;
        }

        .icon-instagram {
            background: rgba(225, 48, 108, 0.1);
            color: #E1306C;
        }

        .icon-linkedin {
            background: rgba(10, 102, 194, 0.1);
            color: #0A66C2;
        }

        .icon-github {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .icon-portfolio {
            background: rgba(16, 185, 129, 0.1);
            color: #10B981;
        }

        /* Responsive */
        @media screen and (max-width: 500px) {
            .grid-links {
                grid-template-columns: 1fr;
                /* Single column on mobile */
            }

            .card.span-2 {
                grid-column: span 1;
            }

            .card {
                min-height: 140px;
                padding: 20px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style></head>
